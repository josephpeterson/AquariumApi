<h1 class="device-sensor-test-button " [class.clickable]="!disabled" (click)="clickAction()">
	<i *ngIf="sensor.value === GpioPinValue.High" class="bi"
		[class.bi-lightbulb-fill]="sensor.polarity == DeviceSensorPolarity.Write"
		[class.bi-diamond-fill]="sensor.polarity == DeviceSensorPolarity.Input"></i>
	<i *ngIf="sensor.value === GpioPinValue.Low" class="bi bi-lightbulb"
		[class.bi-lightbulb]="sensor.polarity == DeviceSensorPolarity.Write"
		[class.bi-diamond-fill]="sensor.polarity == DeviceSensorPolarity.Input"></i>
	<i *ngIf="sensor.value === null" class="bi bi-slash-circle"></i>
</h1>
