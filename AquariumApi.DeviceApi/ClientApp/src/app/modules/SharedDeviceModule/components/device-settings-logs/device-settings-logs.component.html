<h5>Filters</h5>
<div class="row">
  <div class="col-auto" *ngFor="let filter of filters">
    <mat-checkbox  class="p-2" [(ngModel)]="filter.value">{{filter.name}}
    </mat-checkbox>
  </div>
</div>
<div class="card card-body ">
  <code>
          <pre style="height:350px" class="overflow-auto" #scrollWindow>{{getFilteredLog()}}</pre>
          </code>
</div>
