<div class="row">
  <div class="col-auto">
    <device-sensor-test-button [disabled]="hideTest !== null || !sensor.polarity"
      [sensor]="sensor"></device-sensor-test-button>
  </div>

  <div class="col-auto">
    <h3 class="m-0">
      <i *ngIf="sensor.locationId === null" class="bi bi-plug"></i>
      <i *ngIf="sensor.locationId !== null" class="bi bi-phone-vibrate"></i>

      {{sensor.name}}
    </h3>
    <div class="mat-body" *ngIf="small === null">
      <small class="text-muted">
        Type: <b>{{getSensorReadableType((types$ | async),sensor.type)}}</b>
        Board Pin: <b>{{sensor.pin}}</b>
        <span *ngIf="sensor.alwaysOn">Normally On</span>
      </small>

    </div>
  </div>
  <div class="col-sm actions">
    <device-sensor-upsert-button [sensor]="sensor" *ngIf="hideEdit === null">
      <fa-icon [icon]="faEdit" class="px-1"></fa-icon>Edit
    </device-sensor-upsert-button>
  </div>
</div>
