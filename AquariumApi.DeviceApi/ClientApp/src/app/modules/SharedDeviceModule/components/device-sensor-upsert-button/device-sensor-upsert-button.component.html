<ng-container *ngIf="inline !== null else normal">
	<span *ngIf="(configuredDevice$ | async) as device" (click)="clickAction(device)">
		<ng-content></ng-content>
	</span>
</ng-container>
<ng-template #normal>
	<button *ngIf="(configuredDevice$ | async) as device" (click)="clickAction(device)" class="btn btn-link"
		[disabled]="disabled">
		<ng-content></ng-content>
	</button>
</ng-template>
