<div class="container" *ngIf="(deviceInformation$ | async).configuredDevice as configuredDevice">
    <div class="row">
        <div class="col-md">
            <device-page-header>Onboard GPIO Sensors</device-page-header>
            <div class="row mb-5">

                <device-sensor-gpio-board [configuredDevice]="configuredDevice"></device-sensor-gpio-board>
            </div>
            <device-page-header>Wireless Devices
                <small>
                    <device-wireless-device-upsert-button><i
                            class="bi bi-plus"></i>Connect</device-wireless-device-upsert-button>

                </small>
            </device-page-header>
            <device-wireless-device-list [configuredDevice]="configuredDevice"></device-wireless-device-list>
        </div>
        <div class="col-md">
            <device-page-header>Sensors
                <small>
                    <device-sensor-upsert-button><i class="bi bi-plus"></i>Create</device-sensor-upsert-button>
                </small>
            </device-page-header>

            <device-sensor-list [configuredDevice]="configuredDevice"></device-sensor-list>
        </div>
    </div>
</div>
