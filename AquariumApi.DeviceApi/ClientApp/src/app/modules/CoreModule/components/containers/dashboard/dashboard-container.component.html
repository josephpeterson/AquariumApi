<div *ngIf="(deviceInformation$ | async).configuredDevice as configuredDevice">
  <div class="row">
    <div class="col col-sm-4">
      <device-page-header>Aquarium Monitor</device-page-header>
      <div class="row mb-5">
        <device-aquarium-overview-card [aquarium]="configuredDevice.aquarium" [account]="account$ | async">
        </device-aquarium-overview-card>
      </div>
      <device-page-header>Sensors</device-page-header>
      <div class="row mb-5">
        <device-sensor-list [configuredDevice]="configuredDevice" hideEdit small></device-sensor-list>
      </div>
      <device-page-header>Wireless Devices</device-page-header>
      <device-wireless-device-list [configuredDevice]="configuredDevice"></device-wireless-device-list>
    </div>
    <div class="col">
      <device-page-header>Schedule Status</device-page-header>
      <div class="row mb-5">
        <device-schedule-status [deviceInformation]="deviceInformation$ | async"></device-schedule-status>
      </div>
      <device-page-header>Exceptions</device-page-header>
      <div class="row mb-5">
        <device-exception-list></device-exception-list>
      </div>
    </div>
  </div>
</div>
